<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>📋 كشف زيارات افتقاد القس / سيرابيون عزت كاهن بكنيسة ابوفام الجندي بطما</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }

    .container {
      max-width: 900px;
    }

    .week-range {
      background: #fff3cd;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .required-star {
      color: red;
      margin-right: 4px;
    }

    #otherServiceInput {
      border: 2px dashed #28a745;
      background-color: #e8f9ee;
      transition: 0.3s ease;
    }

    #otherServiceInput:focus {
      border-color: #218838;
      background-color: #d4f5de;
      box-shadow: 0 0 6px rgba(33, 136, 56, 0.4);
    }

    /* ✅ إخفاء الأيقونات داخل PDF */
 /* ✅ إخفاء الأيقونات فقط داخل PDF — مع بقاء العمود نفسه */
/* 🌟 تنسيق أيقونة الحذف */
.delete-icon {
  cursor: pointer;
  color: #dc3545;
  font-size: 18px;
  transition: 0.2s ease;
}

.delete-icon:hover {
  color: #a71d2a;
  transform: scale(1.2);
}

/* ✅ إخفاء عمود الحذف بالكامل في PDF */
@media print {
  th.no-print,
  td.no-print {
    display: none !important;
  }
}


  </style>
</head>

<body class="p-3">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="mb-0">📋 كشف زيارات افتقاد القس / سيرابيون عزت كاهن بكنيسة ابوفام الجندي بطما</h2>
    </div>

    <!-- تحديد الأسبوع -->
    <div id="weekSelector" class="card mb-3">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="card-title">تحديد التاريخ</h5>
          <div>
            <button id="toggleReport" class="btn btn-outline-success">عرض التقرير</button>
          </div>
        </div>
        <div class="row g-3 align-items-end">
          <div class="col-md-6">
            <label class="form-label">تاريخ بداية <span class="required-star">*</span></label>
            <input type="date" id="weekStart" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">تاريخ نهاية <span class="required-star">*</span></label>
            <input type="date" id="weekEnd" class="form-control" required>
          </div>
        </div>
        <div id="weekInfo" class="week-range mt-3 d-none text-center fw-bold"></div>
      </div>
    </div>

    <!-- نموذج إضافة زيارة -->
    <div id="visitFormCard" class="card mb-3">
      <div class="card-body">
        <h5 class="card-title">إضافة زيارة جديدة</h5>
        <form id="visitForm" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">اليوم <span class="required-star">*</span></label>
              <input type="date" id="visitDate" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">نوع الخدمة <span class="required-star">*</span></label>
              <select id="serviceType" class="form-select mb-2" required>
                <option value="" disabled selected>اختر نوع الخدمة</option>
                <option value="اعدادى">اعدادى</option>
                <option value="ثانوى">ثانوى</option>
                <option value="أخرى">أخرى</option>
              </select>

              <!-- الحقل الإضافي المخفي -->
              <input type="text" id="otherServiceInput" class="form-control mt-2 d-none"
                placeholder="✏️ اكتب نوع الخدمة هنا">


            </div>
            <div class="col-md-6">
              <label class="form-label">الاسم <span class="required-star">*</span></label>
              <input type="text" id="familyNames" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">رقم التليفون <span class="required-star">*</span></label>
              <input type="tel" id="phoneNumber" class="form-control" pattern="^[0-9]{11}$" maxlength="11"
                oninput="this.value = this.value.replace(/[^0-9]/g, '')" required style="text-align: right;">
            </div>
            <div class="col-md-12">
              <label class="form-label">العنوان <span class="required-star">*</span></label>
              <input type="text" id="address" class="form-control" required>
            </div>
            <div class="col-md-12">
              <label class="form-label">ملاحظات </label>
              <textarea id="notes" class="form-control" rows="2"></textarea>
            </div>
          </div>
          <button type="submit" class="btn btn-success mt-3" id="addVisit" disabled>إضافة الزيارة</button>
        </form>
        <div id="successMessage" class="alert alert-success mt-3 d-none text-center">
          ✅ تمت إضافة الزيارة بنجاح
        </div>
      </div>
    </div>

    <!-- عرض التقرير -->
    <div id="reportCard" class="card mb-3" style="display:none;">
      <div class="card-body">
        <div class="mb-3">
          <h5 class="card-title mb-2 w-100 text-end" style="white-space: normal; line-height: 1.6; font-weight: bold;">
            كشف زيارات افتقاد القس / سيرابيون عزت كاهن بكنيسة ابوفام الجندي بطما
          </h5>

          <div class="d-flex flex-wrap justify-content-end gap-2">
            <button id="downloadPdf" class="btn btn-outline-success">تحميل PDF</button>
            <button id="deleteVisits" class="btn btn-outline-danger">🗑️ حذف الزيارات المحددة</button>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-bordered table-striped" id="reportTable">
            <thead class="table-light">
              <tr>
                <th>اليوم</th>
                <th>نوع الخدمة</th>
                <th>الاسم</th>
                <th>رقم التليفون</th>
                <th>العنوان</th>
                <th>ملاحظات</th>
<th class="no-print">حذف</th> <!-- نسيبه كده، الكلاس no-print هو اللي هيخفيه -->
              </tr>
            </thead>
            <tbody id="reportBody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <!-- مكتبات PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    const weekStartInput = document.getElementById('weekStart');
    const weekEndInput = document.getElementById('weekEnd');
    const weekInfo = document.getElementById('weekInfo');

    const visitForm = document.getElementById('visitForm');
    const addVisitBtn = document.getElementById('addVisit');

    const toggleReportBtn = document.getElementById('toggleReport');
    const reportCard = document.getElementById('reportCard');
    const visitFormCard = document.getElementById('visitFormCard');
    const reportBody = document.getElementById('reportBody');

    const downloadBtn = document.getElementById('downloadPdf');

    // تحميل الزيارات من التخزين
    function getAllVisits() {
      return JSON.parse(localStorage.getItem('visits')) || [];
    }

    // عرض الزيارات
    function loadVisits(start = null, end = null) {
      const allVisits = getAllVisits();
      reportBody.innerHTML = '';

      const filtered = (start && end)
        ? allVisits.filter(v => {
          const date = new Date(v.date);
          return date >= new Date(start) && date <= new Date(end);
        })
        : allVisits;

      // ✅ ترتيب الزيارات حسب التاريخ تصاعدي
      filtered.sort((a, b) => new Date(a.date) - new Date(b.date));

      filtered.forEach((v, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
    <td>${v.date}</td>
    <td>${v.serviceType || '-'}</td>
    <td>${v.familyNames}</td>
    <td>${v.phoneNumber || '-'}</td>
    <td>${v.address || '-'}</td>
    <td>${v.notes || '-'}</td>
    <td class="text-center no-print">
      <span class="delete-icon" title="حذف الزيارة">🗑️</span>
    </td>`;
        reportBody.appendChild(tr);

        // 🗑️ عند الضغط على الأيقونة
        tr.querySelector('.delete-icon').addEventListener('click', () => {
          if (confirm(`هل تريد حذف زيارة  ${v.familyNames}؟`)) {
            const updatedVisits = allVisits.filter(
              (item) =>
                !(
                  item.date === v.date &&
                  item.familyNames === v.familyNames &&
                  item.phoneNumber === v.phoneNumber
                )
            );
            localStorage.setItem('visits', JSON.stringify(updatedVisits));
            loadVisits(start, end);
          }
        });
      });


      // ✅ إظهار أو إخفاء الأزرار العامة
      const deleteBtn = document.getElementById('deleteVisits');
      const downloadBtn = document.getElementById('downloadPdf');

      if (filtered.length === 0) {
        deleteBtn.style.display = 'none';
        downloadBtn.style.display = 'none';
      } else {
        deleteBtn.style.display = 'inline-block';
        downloadBtn.style.display = 'inline-block';
      }
    }

    // حفظ الأسبوع تلقائيًا عند اختيار أي تاريخ
    function saveWeekAutomatically() {
      const start = weekStartInput.value;
      const end = weekEndInput.value;
      if (start && end) {
        weekInfo.textContent = `التقرير من ${start} إلى ${end}`;
        weekInfo.classList.remove('d-none');
        loadVisits(start, end);
      }
    }

    weekStartInput.addEventListener('change', saveWeekAutomatically);
    weekEndInput.addEventListener('change', saveWeekAutomatically);

    // تفعيل زر الإضافة فقط عند اكتمال البيانات
    visitForm.addEventListener('input', () => {
      addVisitBtn.disabled = !visitForm.checkValidity();
    });

    // إضافة زيارة جديدة
    visitForm.addEventListener('submit', e => {
      e.preventDefault();
      if (!visitForm.checkValidity()) return;

      const visit = {
        date: document.getElementById('visitDate').value,
        serviceType: selectedService, // ✅ استخدمنا المتغير الجديد هنا
        familyNames: document.getElementById('familyNames').value,
        phoneNumber: document.getElementById('phoneNumber').value,
        address: document.getElementById('address').value,
        notes: document.getElementById('notes').value
      };

      const allVisits = getAllVisits();
      allVisits.push(visit);
      localStorage.setItem('visits', JSON.stringify(allVisits));

      visitForm.reset();
      addVisitBtn.disabled = true;
      alert('تمت إضافة الزيارة بنجاح ✅');
    });

    // زر عرض/إخفاء التقرير
    toggleReportBtn.addEventListener('click', () => {
      const start = weekStartInput.value;
      const end = weekEndInput.value;
      const showingReport = reportCard.style.display === 'block';

      if (showingReport) {
        reportCard.style.display = 'none';
        visitFormCard.style.display = 'block';

        weekInfo.classList.add('d-none');  // إخفاء الفترة
        weekStartInput.value = '';          // مسح تاريخ البداية
        weekEndInput.value = '';            // مسح تاريخ النهاية

        toggleReportBtn.textContent = 'عرض التقرير';
      } else {
        if (!start || !end) {
          alert('من فضلك اختر فترة التاريخ أولاً');
          return;
        }
        reportCard.style.display = 'block';
        visitFormCard.style.display = 'none';

        weekInfo.classList.remove('d-none'); // عرض الفترة
        toggleReportBtn.textContent = 'إخفاء التقرير';
        loadVisits(start, end);
      }
    });


    // تحميل PDF
downloadBtn.addEventListener('click', async () => {
  if (reportCard.style.display === 'none') {
    alert('من فضلك اعرض التقرير أولاً');
    return;
  }

  // إخفاء الأزرار قبل التصوير
  downloadBtn.style.display = 'none';
  const deleteBtn = document.getElementById('deleteVisits');
  deleteBtn.style.display = 'none';

  // ✅ إخفاء عمود الحذف مؤقتًا قبل إنشاء الـ PDF
  const deleteCols = document.querySelectorAll('th.no-print, td.no-print');
  deleteCols.forEach(col => col.style.display = 'none');

  // نعمل نسخة مؤقتة من التقرير بعرض ثابت (A4)
  const cloned = reportCard.cloneNode(true);
  cloned.style.width = '794px'; // عرض A4 بالـ px
  cloned.style.position = 'absolute';
  cloned.style.left = '-9999px';
  document.body.appendChild(cloned);

  // نصور النسخة
  const canvas = await html2canvas(cloned, {
    scale: 2,
    useCORS: true,
    windowWidth: 794,
  });

  const imgData = canvas.toDataURL('image/png');
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'mm', 'a4');

  const pageWidth = pdf.internal.pageSize.getWidth();
  const imgProps = pdf.getImageProperties(imgData);
  const pdfWidth = pageWidth - 20;
  const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;

  pdf.addImage(imgData, 'PNG', 10, 10, pdfWidth, pdfHeight);
  pdf.save('تقرير_الزيارات.pdf');

  // نحذف النسخة المؤقتة
  document.body.removeChild(cloned);

  // ✅ نرجع عمود الحذف بعد الحفظ
  deleteCols.forEach(col => col.style.display = '');

  // نرجع الأزرار
  downloadBtn.style.display = 'inline-block';
  deleteBtn.style.display = 'inline-block';
});

    // 🗑️ زر حذف الزيارات للفترة المحددة
    const deleteBtn = document.getElementById('deleteVisits');
    deleteBtn.addEventListener('click', () => {
      const start = weekStartInput.value;
      const end = weekEndInput.value;

      if (!start || !end) {
        alert('من فضلك اختر فترة التاريخ أولاً');
        return;
      }

      const confirmDelete = confirm(`هل أنت متأكد من حذف كل الزيارات من ${start} إلى ${end}؟`);
      if (!confirmDelete) return;

      const allVisits = getAllVisits();
      const filteredVisits = allVisits.filter(v => {
        const date = new Date(v.date);
        return !(date >= new Date(start) && date <= new Date(end)); // نحذف اللى داخل الفترة
      });

      localStorage.setItem('visits', JSON.stringify(filteredVisits));
      alert('✅ تم حذف الزيارات في هذه الفترة بنجاح');
      loadVisits(start, end); // نحدّث الجدول بعد الحذف
    });


    // تعريف العناصر
    const serviceType = document.getElementById('serviceType');
    const otherServiceInput = document.getElementById('otherServiceInput');

    // لما المستخدم يغير الاختيار
    serviceType.addEventListener('change', () => {
      if (serviceType.value === 'أخرى') {
        otherServiceInput.classList.remove('d-none'); // أظهر الحقل
        otherServiceInput.required = true; // خليه إلزامي
      } else {
        otherServiceInput.classList.add('d-none'); // اخفي الحقل
        otherServiceInput.required = false;
        otherServiceInput.value = ''; // امسح القيمة القديمة
      }
    });

    // تعديل زر الإضافة ليأخذ القيمة من "أخرى" لو اتكتبت
    visitForm.addEventListener('submit', e => {
      e.preventDefault();
      if (!visitForm.checkValidity()) return;

      // لو اختار "أخرى" نعرضها بالشكل "أخرى (النص)"
      // ✅ دلوقتي بيعرض "أخرى (النص المكتوب)"
      const selectedService =
        document.getElementById('serviceType').value === 'أخرى'
          ? `أخرى (${document.getElementById('otherServiceInput').value.trim()})`
          : document.getElementById('serviceType').value;

      const visit = {
        date: document.getElementById('visitDate').value,
        serviceType: selectedService, // ✅ استخدمنا المتغير الجديد هنا
        familyNames: document.getElementById('familyNames').value,
        phoneNumber: document.getElementById('phoneNumber').value,
        address: document.getElementById('address').value,
        notes: document.getElementById('notes').value
      };


      const allVisits = getAllVisits();
      allVisits.push(visit);
      localStorage.setItem('visits', JSON.stringify(allVisits));

      visitForm.reset();
      otherServiceInput.classList.add('d-none'); // اخفي الحقل تاني بعد الإرسال
      addVisitBtn.disabled = true;
      alert('تمت إضافة الزيارة بنجاح ✅');
    });

  </script>
</body>

</html>
